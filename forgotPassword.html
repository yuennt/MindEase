<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width-device-width, initial=1.0"/>
        <title>Forgot Password</title>

        <link rel="icon" type="image/x-icon" href="images/favicon.ico"/>

        <!-- Bootstrap 5 -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

        <!-- Google Font -->
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">

        <!-- Bootstrap Icons-->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

        <!-- Social Media Icons -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

        <style>
            *{
                margin: 0; 
                padding: 0;
                box-sizing: border-box; 
                font-family: 'Poppins', sans-serif;
            }

            body{
                height: 100vh; 
                display: flex; 
                justify-content: center;
                align-items: center;
                background: linear-gradient();
            }

            .container{
                width: 800px;
                height: auto;
                display: flex;
                border-radius: 12px;
                overflow: hidden;
                box-shadow: 0 10px 30px rgba(0,0,0,0.15);
                background: white;
            }

            /* Left Panel */
            .left.panel{
                width: 100%;
                flex: 1;
                background: url(images/mentalhealth.jpg);
                background-size: cover; 
                background-position: right; 
                position: relative;
                color: white;
                padding: 60px; 
                display: flex;
                flex-direction: column;
                justify-content: center;
                overflow: hidden;
            }

            .left.panel h1{
                font-size: 30px; 
                font-weight: bold; 
                margin-bottom: 20px;
                z-index: 2;
            }

            .left.panel p{
                font-size: 18px; 
                line-height: 1.6;
                max-width: 350px;
                z-index: 2;
            }

            /* Right Panel */
            .right.panel{
                flex: 1;
                background: rgb(196, 195, 195);
                padding: 60px; 
                display: flex;
                flex-direction: column;
                justify-content: center;
            }

            .form-box{
                width: 100%;
                position: relative;
                /*margin-top: 20px;
                margin-bottom: 10px;*/
                
            }

            .goBackbtn{
                position: absolute;
                margin-top: -55px;
                margin-left: -40px;
                color: black; 
                border: none; 
                font-size: 28px;
                font-weight: bold;
                cursor: pointer;
                background: transparent;
                transition: 0.3s;
            }

            .goBackbtn:hover{
                opacity: 1;
                transform: scale(1.2);
            }

            .form-box h2{
                font-size: 24px;
                font-weight: bold;
                margin-bottom: 10px;
                color: black;
                margin-left: 70px;
            }

            .input-group{
                margin-bottom: 20px;
            }

    
            .input-group input{
                width: 100%; 
                height: 50px; 
                border: 3px solid #cfc5c5;
                border-radius: 15px; 
                border-bottom: 3px solid #a6a3a3;   
                padding: 20px;         
                font-size: 16px;       
                outline: none;        
                transition: 0.1s;        
                background: transparent;  
            }

            .input-group input:focus{
                border: 3px solid #1d8db4; 
            }

    
            .resetBtn{
                width: 100%;
                padding: 14px;       
                border: none;        
                border-radius: 15px;                
                background:#1d8db4;               
                color: white;       
                font-size: 18px;         
                font-weight: bold;        
                cursor: pointer;        
                transition: 0.3s; 
            }
            
            .resetBtn:hover{        
                opacity: 0.9;       
                transform: scale(1.05); 
            }
        </style>

        <body>
            <div class="container">
                <!-- Left Side -->
                 <div class="left panel">
                    <h1>Welcome Back</h1>
                    <p>change your password</p>
                 </div>

                <!-- Right Side -->
                <div class="right panel">
                    <!-- Forgot Password Form -->
                    <div class="form-box" id="forgotPasswordForm">
                        <button class="goBackbtn" onclick="window.location.href= 'homepage.html'">
                            <i class="bi bi-arrow-left"></i>
                        </button>

                        <h2>Forgot Password</h2>
                        <p></p>

                        <div class="input-group">
                            <input type="email" placeholder="Email"/>
                        </div>

                        <div class="input-group">
                            <input type="paswword" placeholder="New Password"/>
                        </div>

                        <div class="input-group">
                            <input group="paswword" placeholder="Confirm Password"/>
                        </div>

                        <button class="resetBtn">
                            Reset Password
                        </button>
                    </div>
                </div>
            </div>
        </body>
        
    </head>
</html>
