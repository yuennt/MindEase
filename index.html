<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mental Health Wellbeing Portal</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:linear-gradient(135deg,#e8f5e9,#e3f2fd);
    min-height:100vh;
}

/* LOGIN PAGE */

#loginPage{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.login-card{
    width:380px;
    background:white;
    padding:35px;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,0.15);
    text-align:center;
}

.login-card h1{
    color:#2e7d32;
    margin-bottom:20px;
}

.login-card input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:10px;
}

.login-btn{
    width:100%;
    padding:12px;
    background:#4CAF50;
    color:white;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
}

.login-btn:hover{
    background:#388e3c;
}

/* LOADING PAGE */

#loadingPage{
    display:none;
    height:100vh;
    justify-content:center;
    align-items:center;
}

.loader-box{
    text-align:center;
}

.main-face{
    font-size:100px;
    animation:bounce 1s infinite;
}

@keyframes bounce{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-15px);
    }
}

.progress-container{
    width:500px;
    height:30px;
    background:#ddd;
    border-radius:50px;
    margin-top:30px;
    position:relative;
    overflow:hidden;
}

.progress-bar{
    width:0%;
    height:100%;
    background:linear-gradient(90deg,#53a2dc,#63beca);
    border-radius:50px;
}

.progress-face{
    position:absolute;
    top:-40px;
    left:0;
    font-size:40px;
    transition:0.1s linear;
}

.percent{
    margin-top:20px;
    font-size:24px;
    font-weight:bold;
    color:#2e7d32;
}

.status{
    margin-top:10px;
    color:#555;
}

/* MOOD PAGE */

#moodPage{
    display:none;
    height:100vh;
    text-align:center;
    padding-top:100px;
}

.mood-title{
    color:#2e7d32;
    margin-bottom:30px;
}

.mood-btn{
    font-size:90px;
    cursor:pointer;
    margin:20px;
    transition:0.3s;
}

.mood-btn:hover{
    transform:scale(1.2);
}

/* WEBSITE */

#website{
    display:none;
}

header{
    background:#43a047;
    color:white;
    padding:20px;
    text-align:center;
}

nav{
    margin-top:10px;
}

nav a{
    color:white;
    text-decoration:none;
    margin:0 15px;
    font-weight:bold;
}

.content{
    padding:40px;
}

.card{
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.big-mood{
    font-size:120px;
    text-align:center;
    margin:20px;
}

.message{
    text-align:center;
    font-size:20px;
    color:#444;
}

</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginPage">

    <div class="login-card">

        <h1>🧠 Mental Health Wellbeing</h1>

        <input
            type="text"
            id="username"
            placeholder="Enter Name">

        <input
            type="password"
            id="password"
            placeholder="Enter Password">

        <button
            class="login-btn"
            onclick="login()">

            Login

        </button>

    </div>

</div>

<!-- LOADING -->

<div id="loadingPage">

    <div class="loader-box">

        <div id="mainFace" class="main-face">
            😊
        </div>

        <h2>Preparing Your Wellbeing Dashboard</h2>

        <div class="progress-container">

            <div
                id="progressBar"
                class="progress-bar">
            </div>

            <div
                id="movingFace"
                class="progress-face">
                😊
            </div>

        </div>

        <div
            id="percentage"
            class="percent">
            0%
        </div>

        <div
            id="statusText"
            class="status">

            Starting...

        </div>

    </div>

</div>

<!-- MOOD PAGE -->

<div id="moodPage">

    <h1 class="mood-title">
        How Are You Feeling Today?
    </h1>

    <div>

        <span
            class="mood-btn"
            onclick="selectMood('happy')">

            😊

        </span>

        <span
            class="mood-btn"
            onclick="selectMood('sad')">

            😢

        </span>

        <span
            class="mood-btn"
            onclick="selectMood('angry')">

            😠

        </span>

    </div>

</div>

<!-- HOMEPAGE -->

<div id="website">

<header>

    <h1>🌿 Mental Health Wellbeing Portal</h1>

    <nav>
        <a href="#">Home</a>
        <a href="#">Services</a>
        <a href="#">AI Chat</a>
        <a href="#">Resources</a>
        <a href="#">Contact</a>
    </nav>

</header>

<div class="content">

    <div class="card">

        <div
            id="selectedEmoji"
            class="big-mood">
            😊
        </div>

        <div
            id="welcomeMessage"
            class="message">
        </div>

    </div>

</div>

</div>

<script>

/* LOGIN */

function login(){

    let user =
        document.getElementById("username").value;

    let pass =
        document.getElementById("password").value;

    if(user === "" || pass === ""){

        alert("Please enter name and password.");
        return;
    }

    document.getElementById("loginPage").style.display="none";
    document.getElementById("loadingPage").style.display="flex";

    startLoading();
}

/* LOADING */

function startLoading(){

    let progress = 0;

    let loader = setInterval(() => {

        progress++;

        document.getElementById("progressBar")
            .style.width = progress + "%";

        document.getElementById("percentage")
            .innerHTML = progress + "%";

        const movingFace =
            document.getElementById("movingFace");

        const mainFace =
            document.getElementById("mainFace");

        movingFace.style.left =
            `calc(${progress}% - 20px)`;

        let emoji = "😊";
        let status = "";

        if(progress < 25){
            emoji = "😊";
            status = "Loading wellness resources...";
        }
        else if(progress < 50){
            emoji = "🙂";
            status = "Preparing mood tracker...";
        }
        else if(progress < 75){
            emoji = "😌";
            status = "Connecting AI assistant...";
        }
        else if(progress < 100){
            emoji = "😄";
            status = "Almost ready...";
        }
        else{
            emoji = "🎉";
            status = "Welcome!";
        }

        movingFace.innerHTML = emoji;
        mainFace.innerHTML = emoji;

        document.getElementById("statusText")
            .innerHTML = status;

        if(progress >= 100){

            clearInterval(loader);

            setTimeout(() => {

                document.getElementById("loadingPage")
                    .style.display = "none";

                document.getElementById("moodPage")
                    .style.display = "block";

            },1000);
        }

    },40);
}

/* MOOD SELECTION */

function selectMood(mood){

    document.getElementById("moodPage")
        .style.display="none";

    document.getElementById("website")
        .style.display="block";

    let emoji = "";
    let message = "";

    if(mood === "happy"){
        emoji = "😊";
        message =
        "Wonderful! Keep enjoying your positive day and explore wellbeing activities.";
    }

    if(mood === "sad"){
        emoji = "😢";
        message =
        "We're here to support you. Try relaxation exercises or chat with the AI assistant.";
    }

    if(mood === "angry"){
        emoji = "😠";
        message =
        "Take a moment to breathe deeply. Mindfulness resources may help you feel calmer.";
    }

    document.getElementById("selectedEmoji")
        .innerHTML = emoji;

    document.getElementById("welcomeMessage")
        .innerHTML = message;
}

</script>

</body>
</html>
