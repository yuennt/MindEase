<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MindEase</title>


<link rel="icon" type="image/x-icon" href="images/favicon.ico"/>

<!-- Google Font -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">

<!-- Bootstrap 5 --> 
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

<!-- Social Media Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>
    *{
        box-sizing: border-box; 
        font-family: 'Poppins', sans-serif;
    }
    
    body{
        width: 100%;
        height: 100vh;
        background: linear-gradient(rgba(187, 180, 180, 0.5), rgba(172, 161, 161, 0.5)),
        url('images/smile 2.jpg');
        background-size: cover;
        background-repeat: no-repeat;
        background-position: center;
        color: black;
        
        
    }
    
    /* Login Page */
    #loginPage{
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    
    .login-card{
        width: 380px;
        /* background: url('images/smile 2.jpg') no-repeat center center; */
        background: rgb(233, 220, 220);
        padding: 35px;
        border-radius: 20px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        text-align: center;
    }

    .login-card img{
        width: 100px;
        height: 100px;
    }

    .login-card p{
        color: white !important;
        margin-top: 3px;
        font-size: 28px;
        font-family: 'Impact', sans-serif;
        letter-spacing: 4px;
        margin-left: 85px;
    }

    .login-card span{
        color:#6b9af0;
        font-size: 28px;
        font-family: 'Impact', sans-serif;
        letter-spacing: 4px;
        margin-right: 100px;
    }

    .login-card input{
        width: 100%;
        height: 50px;
        padding: 15px; 
        margin: 10px 0;
        border: 2px solid #cfc5c5;
        border-radius: 15px;
        border-bottom: 2px solid #a6a3a3;
        font-size: 16px;
        outline: none;
        transition: 0.1s;
    }

    .login-card input:focus{
        border: 3px solid #1d8db4;
    }

    .loginBtn{
        width: 100%;
        padding: 12px;
        background: #c7a85c;
        color: white;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-size: 16px;
        font-weight: bold;
        margin-top: 10px;
    }

    .loginBtn:hover{
        /* background: #388e3c; */
        opacity: 0.9;
        transform: scale(1.05);
    }
    
    /* Loading Page */
    #loadingPage{
        display: none;
        height: 100vh;
        justify-content: center;
        align-items: center;
        text-align: center;
    }

    .loader-box{
        text-align: center;
        border-radius: 20px;
        padding: 60px;
        background: rgba(239, 233, 233, 0.8);
        box-shadow: 0 10px 25px rgba(0,0,0,0.15);

    }

   .main-face i{
        font-size: 100px;
        margin-bottom: 20px;
        animation: bounce 1s infinite;
   }
    
   

    @keyframes bounce{
        0%, 100% {
            transform: translateY(0);
        }
        50% {
            transform: translateY(-20px);
        }
    }

    .loader-box h2{
        font-size: 25px;
        font-weight: bold;
        margin-bottom: 20px;
        color: #333;
    }
    
    .progress-container{
        width: 400px;
        height: 25px;
        background: #ddd;
        border-radius: 20px;
        margin: auto;
        position: relative;
        overflow: hidden;
    }
    
    .progress-bar{
        width:0%;
        height:100%;
        background:#52a1c8;
        border-radius: 10px;
        transition: width 0.3s ease;
    }
    
    .progress-face{
        position: absolute;
        left: 0;
        top: -4px;
        right: 3; 
        font-size: 24px;
        transition: 0.3s linear;
        z-index: 10;
    }

    .percent{
        font-size: 30px;
        margin-top: 20px;
        font-weight: bold; 
        color: #333;
    }

    .status{
        font-size: 20px;
        font-weight: 500;
        margin-top: 15px;
        color: #555;
    }
</style>
</head>

<body>
    <!-- Login Page -->
    <div id="loginPage">
        <div class="login-card">
            <img src="images/mindEase.png" alt="MindEase" width="80" height="80">
            <p>Mind<span>Ease</span></p>
            
             
            <input type="text" id="username" placeholder="Username">
            <input type="password" id="password" placeholder="Password">
            <button class="loginBtn" onclick="login()">Login</button>
        </div>
    </div>
    
    <!-- Loading... -->
    <div id="loadingPage">
        <div class="loader-box">
            <div id="mainFace" class="main-face">
                <i class="bi bi-emoji-frown"></i>
            </div> 
            
            <h2>Preparing Mental Wellbeing Assistant</h2>
                
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
                <div class="progress-face" id="movingFace">
                    <i class="bi bi-emoji-smile"></i>
                </div>
            </div>
            
            <div class="percent" id="percentage">0%</div>
                <div class="status" id="statusText">
                    Starting...
                </div>
            </div>
        </div>
    </div>

<script>
    /* Login */
    function login(){
        let username = document.getElementById("username").value;
        let password = document.getElementById("password").value;
        
        if(username==="" || password===""){
            alert("Please enter your name and password!");
            return;
        } 
        document.getElementById("loginPage").style.display="none";
        document.getElementById("loadingPage").style.display="flex";

        startLoading();
    }
    
    /* Loading... */
    function startLoading(){
        let progress = 0;
        let load = setInterval(() => {
            progress++;
            
            document.getElementById("progressBar").style.width = progress + "%";
            document.getElementById("percentage").innerHTML = progress + "%";

            const movingFace = document.getElementById("movingFace");
            const mainFace = document.getElementById("mainFace"); 

            movingFace.style.left = `calc(${progress}% - 20px)`;

           let emoji = "";
           let status = "";
           
           if(progress < 25){
            emoji = "bi bi-emoji-frown";
            status = "Loading mental health resources...";
           }
           else if(progress < 50){
            emoji = "bi bi-emoji-expressionless";
            status = "Initializing wellbeing features...";
           }
           else if(progress < 80){
            emoji = "bi bi-emoji-neutral";
            status = "Connecting AI Assistant...";
           }
           else if(progress < 100){
            emoji = "bi bi-emoji-smile";
            status = "Almost ready...";
           }
           else {
            emoji = "bi bi-emoji-smile";
            status = "Welcome to MindEase!";
        }

        movingFace.innerHTML = `<i class="${emoji}"></i>`; 
        mainFace.innerHTML = `<i class="${emoji}"></i>`;

        document.getElementById("statusText").innerHTML = status;

        if(progress >= 100){

            clearInterval(load);

            setTimeout(()=>{
                window.location.href = "homepage.html"; 
            },1000);
        }

    },40);
}

</script>

</body>
</html>
