<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>

    <link rel="icon" type="image/x-icon" href="images/favicon.ico"/>
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

    <style>
        *{
            margin: 0; 
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body{
            height:100vh;   
            display:flex;     
            justify-content:center;    
            align-items:center;    
            /*background:linear-gradient(200deg, #b3f8e385, #948888);*/
            background: linear-gradient(rgba(187, 180, 180, 0.5), rgba(172, 161, 161, 0.5)),
            url('images/smile 2.jpg');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
        }

        .container{
            width: 900px;
            height: auto;
            display: flex;
            border-radius: 12px; 
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            background: #fff;
        }

        /* Left Panel */
        .left.panel{
            width: 100%;
            flex: 1; 
            /*background: linear-gradient(150deg, #0e7aa7, #6aa3d9);*/                                                                                                                  
            background: url('images/mentalhealth.jpg');
            background-size: cover; 
            background-position: right;
            position: relative; 
            color: white; 
            padding: 60px; 
            display: flex;
            flex-direction: column; 
            justify-content: center; 
            overflow: hidden; 
        }

        .left.panel h1{
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 20px;
            z-index: 2;
            display: block; 
            margin: 0 auto;
        }

        .left.panel p{
            font-size: 18px;
            line-height: 1.6;
            max-width: 350px;
            justify-content: center;
            z-index: 2;
            display: block; 
            margin: 0 auto; 
            text-align: center;
        }

        /* Right Panel */
        .right.panel{
            flex: 1; 
            background: white;
            padding: 60px;            
            display: flex;
            justify-content: center; 
            align-items: center; 
            flex-direction: column;
        }

        .form-box{
            width: 100%;
            position: relative;
            /*padding: 40px;*/
            /*border-radius: 12px;*/
        }

        .goBackbtn{
            position: absolute;
            /*top: 1px;*/
            /*left: 5px;*/
            margin-top: -40px;
            margin-left: -40px;
            color: black;
            border: none;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            background: transparent;
            transform: scale(1);
            transition: 0.3s;
        }

        .goBackbtn:hover{
            opacity: 1;
            transform: scale(1.2);
        }

        .form-box h2{
            font-size: 28px;
            color: black;
            margin-bottom: 15px;
            /*margin-left: 100px;*/
            display: flex;
            justify-content: center;
        }

        .form-box p{
            color: #666;
            margin-bottom: 35px; 
            font-size: 12px;
            margin-left: 8px;
        } 

        .input-group{
            margin-bottom: 30px;
        }

        .input-group input{
            width: 100%; 
            height: 50px; 
            /* border: none; */
            border: 2px solid #cfc5c5;
            border-radius: 15px; 
            border-bottom: 2px solid #a6a3a3; 
            /*padding: 12px 5px;*/ 
            padding: 20px; 
            font-size: 16px;
            outline: none;
            transition: 0.1s;
            background: transparent;
        }

        .input-group input:focus{
            border: 3px solid #1d8db4; 
        }

        .options{
            display: flex; 
            align-items: center; 
            gap: 5px;
            margin-bottom: 30px;
            color: #666;
            font-size: 14px;
            justify-content: center;
        }

        span{
            margin-left: auto; 
        }

        .options a{
            color: #0789df; 
            text-decoration: none;
            font-size: 14px;
        }

        .btn{
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 15px; 
            background:#c7a85c;
            color: white;
            font-size: 18px; 
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s; 
            align-items: center;
            /*margin-left: 125px;
            margin-top: 20px;*/
        }
        
        .btn:hover{
            opacity: 0.9;
            transform: scale(1.05); 
        }

        .signup-text{
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }

        .signup-text a{
            color: #0789df;
            text-decoration: none;
            /*font-weight: bold;*/
        }
    </style>
<body>
<div class="container">
   <!-- Left Side-->
    <div class="left panel">
        <h1>Welcome Back!</h1>
        <p>
            You can sign in to access your exisitng profile
        </p>
    </div>

    <!-- Right Side-->
     <div class="right panel">
        <!--Sign in Form-->
        <div class="form-box" id="signinForm">
            <button class="goBackbtn" onclick="window.location.href='homepage.html'">
                <i class="bi bi-arrow-left"></i>
            </button>

            <h2>Sign In</h2>
            <p>
                Please enter your credentials to sign in your account
            </p>

            <div class="input-group">
                <input type="text" placeholder="Username or Email"/>
            </div>

            <div class="input-group">
                <input type="password" placeholder="Password"/>
            </div>

            <div class="options">
                <input type="checkbox"/>
                <label>Remember Me</label>
            
                <span><a href="forgotPassword.html">Forgot Password?</a></span>
            </div>

            <button class="btn">Login</button>
        </div>

        <div class="signup-text">
            Don't have an account? 
            <a href="sign up.html">Sign Up</a>
        </div>
     </div>

</div>
</body>
</html>
